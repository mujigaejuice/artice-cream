<!doctype html>
<html lang="ko">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
  <body style="margin:0;background:#fafaf9;font-family:Arial,sans-serif;color:#292524;">
    <main style="max-width:480px;margin:32px auto;padding:32px 24px;background:#ffffff;border-radius:16px;">
      <p style="color:#78716c;font-size:14px;">artice cream</p>
      <h1 style="font-size:24px;">이메일 인증번호</h1>
      <p style="font-size:16px;line-height:1.7;">로그인이나 본인 확인을 요청한 화면에 아래 번호를 입력해 주세요.</p>
      <p style="font-size:32px;font-weight:bold;letter-spacing:6px;padding:20px;background:#f5f5f4;border-radius:12px;">{{ .Token }}</p>
      <p style="font-size:14px;line-height:1.7;">가장 최근에 받은 번호를 사용해 주세요. 번호가 만료됐다면 요청한 화면에서 다시 받을 수 있어요.</p>
      <p style="font-size:14px;line-height:1.7;color:#78716c;">본인이 요청하지 않았다면 이 메일을 무시해 주세요. 인증번호를 다른 사람에게 알려주지 마세요.</p>
    </main>
  </body>
</html>
